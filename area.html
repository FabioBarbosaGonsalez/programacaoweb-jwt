<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Área Restrita</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Área restrita (Etapa 2) -->
  <h2 id="usuario"></h2>
  <p id="mensagem"></p>
  <button id="logoutBtn">Sair</button>

  <script>
    // 1. Recupera o token do localStorage
    const token = localStorage.getItem("token");

    if (!token) {
      // 2. Bloqueia o acesso caso o token não exista
      mensagem.textContent = "Acesso negado. Faça login.";
      logoutBtn.style.display = "none";
      window.location.href = "index.html";
    } else {
      // 3. Decodifica o payload (2ª parte do token, em Base64) e exibe o nome no topo
      const payload = JSON.parse(atob(token.split(".")[1]));
      usuario.textContent = "Bem-vindo, " + payload.name;
      mensagem.textContent = "Acesso permitido! Token encontrado.";
    }

    // 4. Logout: apaga o token e volta para index.html
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
